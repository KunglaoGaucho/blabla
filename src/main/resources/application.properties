# Conexão com o MongoDB Atlas lida do arquivo .env (não versionado)
spring.config.import=optional:file:.env[.properties]
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:thindesk}
spring.data.mongodb.auto-index-creation=true

# Usuário padrão do sistema
spring.security.user.name=${THINDESK_ADMIN_USUARIO:admin}
spring.security.user.password=${THINDESK_ADMIN_SENHA:thindesk}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Dashboard
thindesk.fuso-horario=America/Sao_Paulo
# Cria chamados de exemplo quando a coleção tem poucos registros
thindesk.dados-exemplo.habilitado=${THINDESK_DADOS_EXEMPLO:true}
thindesk.dados-exemplo.quantidade=160

logging.level.com.pfc=INFO

# Swagger UI (teste da API pelo navegador)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.paths-to-match=/api/**
